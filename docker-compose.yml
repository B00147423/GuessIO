services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIRECT_URI=${REDIRECT_URI}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      guessioserver:
        condition: service_started

  guessioserver:
    build: ./GuessIOServer
    ports:
      - "9001:9001"  # WebSocket server
      - "50051:50051"  # gRPC server
    environment:
      - TWITCH_OAUTH=${TWITCH_OAUTH:-}
      - TWITCH_NICK=${TWITCH_NICK:-}
      - TWITCH_CHANNEL=${TWITCH_CHANNEL:-}
    volumes:
      - ./GuessIOServer/config.json:/app/config.json:ro
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-guessio}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-guessio}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: