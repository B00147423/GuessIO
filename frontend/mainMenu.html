<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuessIO - Main Menu</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="menu-page">
    <div class="landing-bg" aria-hidden="true"></div>

    <header class="menu-header">
        <a class="menu-brand" href="/" aria-label="GuessIO home">
            <span class="menu-brand__mark" aria-hidden="true">🎨</span>
            <span class="menu-brand__name">GuessIO</span>
        </a>
        <div class="user-pill" id="userPill">
            <img id="userAvatar" src="/default-avatar.png" alt="" class="user-pill__avatar" width="40" height="40">
            <div class="user-pill__text">
                <span class="user-pill__label">Signed in</span>
                <span id="userWelcomeText" class="user-pill__name">Welcome!</span>
            </div>
        </div>
    </header>

    <main class="menu-main">
        <section class="menu-card" aria-labelledby="menu-title">
            <p class="menu-eyebrow">Streamer hub</p>
            <h1 id="menu-title" class="menu-title">Ready to draw?</h1>
            <p class="menu-desc">Create a room, pick a word theme, and let Twitch chat guess live.</p>

            <div class="menu-buttons">
                <button id="createRoomBtn" type="button" class="btn btn-primary btn-lg menu-btn menu-btn--primary">
                    <span class="menu-btn__icon" aria-hidden="true">✨</span>
                    Create room
                </button>
                <button id="leaderboardBtn" type="button" class="btn btn-secondary btn-lg menu-btn">
                    <span class="menu-btn__icon" aria-hidden="true">🏆</span>
                    Leaderboard
                </button>
                <button id="settingsBtn" type="button" class="btn btn-secondary btn-lg menu-btn">
                    <span class="menu-btn__icon" aria-hidden="true">⚙️</span>
                    Settings
                </button>
                <button id="logoutBtn" type="button" class="btn btn-danger btn-lg menu-btn menu-btn--logout">
                    Log out
                </button>
            </div>

            <p class="menu-footnote">Leaderboard &amp; settings are coming soon.</p>
        </section>
    </main>

    <script type="module" src="src/mainMenu.js?v=1703123456"></script>
</body>
</html>
