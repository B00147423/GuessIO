<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuessIO - Game Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Short+Stack&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css?v=24" />
  <link rel="stylesheet" href="./src/css/dialog.css" />
</head>
<body class="game-page gartic-room gartic-choosing">
  <div class="gartic-bg" aria-hidden="true"></div>

  <div class="gartic-layout stream-layout">
    <aside class="gartic-sidebar stream-sidebar">
      <section class="gartic-panel gartic-panel--players stream-panel--top">
        <div class="gartic-panel-binding" aria-hidden="true"></div>
        <div class="gartic-panel-inner">
          <h4 class="gartic-panel-title">Players</h4>
          <span id="playerCount" class="gartic-player-count">0 players</span>
          <ul id="players" class="gartic-players"></ul>
        </div>
      </section>

      <section class="gartic-panel gartic-panel--feed stream-panel--mid">
        <div class="gartic-panel-inner">
          <p class="gartic-feed-hint">Twitch chat → !guess word</p>
          <div id="guessDisplay" class="game-feed gartic-feed" aria-live="polite"></div>
          <div id="scoreDisplay" class="score-display" hidden></div>
        </div>
      </section>

      <div class="stream-camera-slot">
        <section class="stream-bottom-panel" id="streamBottomPanel">
          <div class="gartic-slot-inner">
            <h3 class="gartic-slot-title" id="bottomSlotTitle">Choose a word</h3>
            <div class="gartic-slot-body">
              <div id="wordLayer" class="gartic-slot-layer">
                <div id="wordChoices" class="gartic-word-choices"></div>
              </div>
              <div id="toolsLayer" class="gartic-slot-layer drawing-tools">
                <input type="color" id="colorPicker" value="#000000" />
                <label class="gartic-tool-label">Brush size</label>
                <input type="range" id="brushSize" min="1" max="20" value="4" />
                <label class="gartic-tool-label">Opacity</label>
                <input type="range" id="alphaPicker" min="0" max="1" step="0.05" value="1" />
                <div class="game-controls">
                  <button id="clearBtn" type="button" class="gartic-tool-btn">Clear</button>
                  <button id="undoBtn" type="button" class="gartic-tool-btn">Undo</button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </aside>

    <main class="gartic-stage stream-stage">
      <div class="gartic-notebook">
        <div class="gartic-notebook-spiral" aria-hidden="true"></div>

        <div class="gartic-notebook-bar">
          <div class="gartic-notebook-bar__left">
            <div id="liveIndicator" class="live-indicator live-indicator--checking" hidden>
              <span class="live-dot"></span>
              <span id="liveLabel">…</span>
            </div>
            <div id="wordDisplay" class="gartic-word-reveal" hidden></div>
          </div>
          <button id="backToMenuBtn" type="button" class="gartic-close" aria-label="Leave room">×</button>
        </div>

        <div class="gartic-notebook-body">
          <div id="choosingOverlay" class="gartic-choosing gartic-phase-layer">
            <div class="gartic-stage-logo">
              <span class="gartic-stage-logo__icon" data-icon="palette" aria-hidden="true"></span>
              <span class="gartic-stage-logo__text">GuessIO <strong>SHOW!</strong></span>
            </div>
            <p class="gartic-choosing-text">The streamer is choosing a word</p>
          </div>

          <div id="countdownOverlay" class="gartic-countdown gartic-phase-layer">
            <span id="countdownNumber" class="gartic-countdown__num">3</span>
          </div>

          <div class="canvas-wrap gartic-canvas-wrap gartic-phase-layer" id="canvasArea">
            <canvas id="draw" width="1280" height="720"></canvas>
          </div>
        </div>

        <footer class="gartic-notebook-footer">
          <span id="timerDisplay" class="gartic-timer" aria-hidden="true">&nbsp;</span>
          <span id="roundIndicator" class="gartic-round">1/10</span>
        </footer>

        <div class="gartic-page-curl" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <script type="module" src="./src/game/game.js?v=20"></script>
</body>
</html>
